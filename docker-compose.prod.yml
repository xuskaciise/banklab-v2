# Production stack for the shared VPS. See docs/deploy.md.
#
# Run with an explicit project name so it never collides with V1 or other
# projects on the VPS:
#   docker compose -p banklab2 -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# V1 is the compose project "banklab" on the same VPS; this one is "banklab2".
# Nothing is published on public ports: the host nginx reaches the app on
# 127.0.0.1:${API_PORT} (Django) and 127.0.0.1:${WEB_PORT} (Next.js).
# See deploy/nginx-banklab2.conf.
name: banklab2

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DJANGO_DEBUG: "false"
      MEDIA_ROOT: /app/media
    command: >
      sh -c "python manage.py createcachetable &&
             python manage.py migrate --noinput &&
             exec gunicorn config.wsgi:application --config gunicorn.conf.py"
    volumes:
      - media_data:/app/media
    ports:
      - "127.0.0.1:${API_PORT:-8100}:8000"
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3000"
    networks: [internal]
    depends_on:
      - backend

volumes:
  db_data:
  media_data:

networks:
  internal:
