# BankLab V2: /etc/nginx/conf.d/banklab2.conf on the shared VPS (host nginx).
#
# It follows the other sites on the VPS:
# - Cloudflare (proxied, SSL "Full (strict)") talks to host nginx.
# - nginx terminates TLS with a Let's Encrypt cert issued by
#   `certbot --nginx -d bank2.siulabs.so`. Certbot adds the 443 block below.
# - The visitor IP is already restored globally from CF-Connecting-IP by
#   conf.d/00-cloudflare-realip.conf, so $remote_addr is the student's IP.
#
# Replace PROXY_SHARED_SECRET with the value from .env.prod, then
# `chmod 600 /etc/nginx/conf.d/banklab2.conf`.

server {
    listen 80;
    server_name bank2.siulabs.so;

    # KYC photos/signatures/ID scans are capped at 5 MB by the API.
    client_max_body_size 8M;

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-BankLab-Proxy "PROXY_SHARED_SECRET";
        proxy_read_timeout 90s;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-BankLab-Proxy "PROXY_SHARED_SECRET";
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        expires 30d;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }
}
