# BankLab V2 server block for the VPS's shared nginx (behind Cloudflare).
# Replace BANKLAB_DOMAIN with the real host name and PROXY_SHARED_SECRET with
# the same value as in .env.prod (keep this file chmod 600 on the server).
# BANKLAB_DOMAIN is e.g. a subdomain of siulabs.so. Only this file is added; other projects' blocks are untouched.
#
# Upstreams: if the shared nginx runs in Docker on ${PROXY_NETWORK}, use the
# aliases below. If nginx runs on the host, use 127.0.0.1:8100 / :3100.

# Real visitor IP from Cloudflare (CF-Connecting-IP), trusted only from
# Cloudflare's ranges. Keep this list current: https://www.cloudflare.com/ips/
# (If these directives already exist in the shared nginx's http{} block, drop them here.)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    server_name BANKLAB_DOMAIN;

    # KYC photos/signatures/ID scans are capped at 5 MB by the API.
    client_max_body_size 8M;

    # Cloudflare terminates TLS; it tells us the visitor's scheme. With SSL
    # mode "Flexible" the hop to us is plain HTTP, so forward "https" when
    # Cloudflare saw https (Django then sets Secure cookies correctly).
    set $banklab_proto $scheme;
    if ($http_cf_visitor ~* '"scheme":"https"') {
        set $banklab_proto https;
    }

    location /api/ {
        proxy_pass http://banklab2-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $banklab_proto;
        proxy_set_header X-BankLab-Proxy "PROXY_SHARED_SECRET";
        proxy_read_timeout 90s;
    }

    location /admin/ {
        proxy_pass http://banklab2-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $banklab_proto;
        proxy_set_header X-BankLab-Proxy "PROXY_SHARED_SECRET";
    }

    location /static/ {
        proxy_pass http://banklab2-api:8000;
        proxy_set_header Host $host;
        expires 30d;
    }

    location / {
        proxy_pass http://banklab2-web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $banklab_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }
}
